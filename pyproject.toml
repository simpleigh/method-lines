[build-system]
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#declaring-the-build-backend

# A list of dependencies needed to build the project.
requires = [
    "uv_build>=0.13.5",  # https://docs.astral.sh/uv/concepts/build-backend/
]

# The build backend to be used.
build-backend = "uv_build"


[dependency-groups]
# This specification defines dependency groups, a mechanism for storing package
# requirements in pyproject.toml files such that they are not included in
# project metadata when it is built.
# https://packaging.python.org/en/latest/specifications/dependency-groups/#the-dependency-groups-table
# https://docs.astral.sh/uv/concepts/projects/dependencies/#dependency-groups

dev = [
    "pytest>=9.2.0",  # https://docs.pytest.org/en/latest/
    "pytest-cov>=7.1.0",  # https://pytest-cov.readthedocs.io/en/latest/
    "ruff>=0.17.3",  # https://docs.astral.sh/ruff/
]


[project]
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

# Put the name of your project on PyPI.
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#name
name = "method-lines"

# Put the version of your project.
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#version
version = "0.1.2"

# If your project has dependencies, list them.
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#dependencies-optional-dependencies
dependencies = [
    "XlsxWriter>=3.3.0",  # https://xlsxwriter.readthedocs.io/
    "ringing-lib>=0.5.1",  # https://ringing-lib-python.readthedocs.io/en/latest/
]

# This lets you declare the minimum version of Python that you support
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#python-requires
requires-python = ">=3.11"

# Lists of people identified by a name and/or an email address
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#authors-maintainers
authors = [{ name = "Leigh Simpson", email = "code@simpleigh.com" }]

# This should be a one-line description of your project, to show as the
# “headline” of your project page on PyPI.
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#description
description = "Produces method lines and resources for peals in parts."

# This is a longer description of your project, to display on your project page
# on PyPI.
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#readme
readme = "README.rst"

# The new format for license is a valid SPDX license expression consisting of
# one or more license identifiers.
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#license
license = "GPL-3.0-or-later"

# This is a list of license files and files containing other legal information
# you want to distribute with your package.
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#license-files
license-files = ["COPYING", "COPYING.GPL"]

# A list of PyPI classifiers that apply to your project
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#classifiers
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]


[project.scripts]
# To install a command as part of your package, declare it in the
# `[project.scripts]` table.
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#creating-executable-scripts

method-lines = "method_lines.commands:execute"


[project.urls]
# A list of URLs associated with your project
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#urls

Repository = "https://github.com/simpleigh/method-lines"


[tool.ruff.lint]
# https://docs.astral.sh/ruff/configuration/

# A list of rule codes or prefixes to ignore.
# https://docs.astral.sh/ruff/settings/#ignore
ignore = [
    'RUF002',  # ambiguous-unicode-character-docstring - ditto
]

# A list of rule codes or prefixes to enable.
# @see https://docs.astral.sh/ruff/settings/#select
select = [
    'B',    # flake8-bugbear
    'BLE',  # flake8-blind-except
    'C4',   # flake8-comprehensions
    'COM',  # flake8-commas
    'E',    # pycodestyle
    'EXE',  # flake8-executable
    'F',    # Pyflakes
    'FLY',  # flynt
    'G',    # flake8-logging-format
    'I',    # isort
    'ICN',  # flake8-import-conventions
    'INP',  # flake8-no-pep420
    'ISC',  # flake8-implicit-str-concat
    'PIE',  # flake8-pie
    'PYI',  # flake8-pyi
    'Q',    # flake8-quotes
    'RSE',  # flake8-raise
    'RUF',  # Ruff-specific rules
    'S',    # flake8-bandit
    'SLF',  # flake8-self
    'T10',  # flake8-debugger
    'T20',  # flake8-print
    'TCH',  # flake8-type-checking
    'TID',  # flake8-tidy-imports
    'UP',   # pyupgrade
    'W',    # pycodestyle
]


[tool.ruff.lint.flake8-quotes]
# https://docs.astral.sh/ruff/settings/#flake8-quotes

# Quote style to prefer for docstrings (either "single" or "double").
# https://docs.astral.sh/ruff/settings/#docstring-quotes
docstring-quotes = 'double'

# Quote style to prefer for inline strings (either "single" or "double").
# https://docs.astral.sh/ruff/settings/#inline-quotes
inline-quotes = 'single'

# Quote style to prefer for multiline strings (either "single" or "double").
# https://docs.astral.sh/ruff/settings/#multiline-quotes
multiline-quotes = 'single'


[tool.ruff.lint.isort]
# https://docs.astral.sh/ruff/settings/#isort

# Combines as imports on the same line.
# https://docs.astral.sh/ruff/settings/#combine-as-imports
# https://pycqa.github.io/isort/docs/configuration/options.html#combine-as-imports
combine-as-imports = true

# Don't sort straight-style imports (like `import sys`) before from-style
# imports (like `from itertools import groupby`). Instead, sort the imports by
# module, independent of import style.
# https://docs.astral.sh/ruff/settings/#force-sort-within-sections
# https://pycqa.github.io/isort/docs/configuration/options.html#force-sort-within-sections
force-sort-within-sections = true

# The number of blank lines to place after imports. -1 for automatic
# determination.
# https://docs.astral.sh/ruff/settings/#lines-after-imports
# https://pycqa.github.io/isort/docs/configuration/options.html#lines-after-imports
lines-after-imports = 2


[tool.ruff.lint.per-file-ignores]
# A list of mappings from file pattern to rule codes or prefixes to exclude,
# when considering any matching files.
# https://docs.astral.sh/ruff/settings/#lint_per-file-ignores

"method_lines/tests/**" = [
    "S101",  # assert necessary in tests
]


[tool.coverage.run]

# Whether to measure branch coverage in addition to statement coverage.
# https://coverage.readthedocs.io/en/latest/config.html#run-branch
branch = true

# A list of file name patterns, the files to leave out of measurement or
# reporting.
# https://coverage.readthedocs.io/en/latest/config.html#run-omit
omit = ["method_lines/tests/*"]


[tool.uv.build-backend]
# https://docs.astral.sh/uv/concepts/build-backend/

# The name of the module directory inside `module-root`.
# https://docs.astral.sh/uv/reference/settings/#build-backend_module-name
# https://docs.astral.sh/uv/concepts/build-backend/#modules
module-name = "method_lines"

# The directory that contains the module directory.
# https://docs.astral.sh/uv/reference/settings/#build-backend_module-root
# https://docs.astral.sh/uv/concepts/build-backend/#modules
module-root = ""
