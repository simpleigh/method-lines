# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Build

on: push

jobs:
  build:
    runs-on: ubuntu-26.04

    env:
      UV_PYTHON:
        ${{ matrix.python-version }}

    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        # https://github.com/astral-sh/setup-uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          sudo apt-get install libreadline8t64 libgdome2-0
          wget https://github.com/ringing-lib/ringing-lib-deb/releases/download/v0.4.0-6/libringing-dev_0.4.0-6_amd64.deb
          wget https://github.com/ringing-lib/ringing-lib-deb/releases/download/v0.4.0-6/libringing-bin_0.4.0-6_amd64.deb
          sudo dpkg --install libringing-dev_0.4.0-6_amd64.deb
          sudo dpkg --install libringing-bin_0.4.0-6_amd64.deb

      - name: Install Python dependencies
        run: make sync

      - name: Build package
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Publish test coverage
        # https://github.com/codecov/codecov-action
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build examples
        run: uv run method-lines all examples/*/*

    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
