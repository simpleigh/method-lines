# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Build

on: push

permissions:
  contents: read # actions/checkout

jobs:
  ci:
    name: CI verification
    runs-on: ubuntu-latest

    env:
      ENVIRCONMENT: ci

    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        # https://github.com/zizmorcore/zizmor-action
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  build:
    needs: ci
    runs-on: ubuntu-26.04

    env:
      UV_PYTHON:
        ${{ matrix.python-version }}

    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        # https://github.com/astral-sh/setup-uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          sudo apt-get install libreadline8t64 libgdome2-0
          wget https://github.com/ringing-lib/ringing-lib-deb/releases/download/v0.4.0-6/libringing-dev_0.4.0-6_amd64.deb
          wget https://github.com/ringing-lib/ringing-lib-deb/releases/download/v0.4.0-6/libringing-bin_0.4.0-6_amd64.deb
          sudo dpkg --install libringing-dev_0.4.0-6_amd64.deb
          sudo dpkg --install libringing-bin_0.4.0-6_amd64.deb

      - name: Install Python dependencies
        run: make sync

      - name: Build package
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Publish test coverage
        if: ${{ strategy.job-index == 0 }}
        # https://github.com/codecov/codecov-action
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build examples
        run: uv run method-lines all examples/*/*

    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

  merge-dependabot:
    name: Merge Dependabot changes
    permissions:
      contents: write
      pull-requests: read
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check PR author and merge
        run: |
          AUTHOR=$(gh pr view --json author --jq '.author.login')
          echo "${AUTHOR}"
          if [[ "${AUTHOR}" == 'app/dependabot' ]]; then
            gh pr merge --rebase
          fi
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
